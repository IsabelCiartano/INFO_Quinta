<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parco e Specie Animali</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
}

.card{
    border:1px solid black;
    padding:10px;
    margin:10px 0;
    width:250px;
}

input{
    display:block;
    margin:5px 0;
}
</style>

</head>
<body>

<h2>Visita</h2>

<div id="data"></div>
<div id="guida"></div>
<div id="sentiero"></div>
<div id="persone"></div>


<hr>

<hr>

<h1> Gestione Animali</h1>

<button id="lista">LISTA</button>
<button id="cerca">CERCA</button>
<button id="aggiorna">AGGIUNGI</button>

<div id="contenuto"></div>

<script>
fetch("parco.json")
.then(r=>r.json())
.then(data=>{

    document.getElementById("data").innerHTML="<b>"+data.data+"</b>";
    document.getElementById("guida").innerHTML="guida: " +data.guida;
let divSentiero = document.getElementById("sentiero");

divSentiero.innerHTML = `
    <b>${data.sentieroPedestre.nome}</b><br>
    Lunghezza: ${data.sentieroPedestre.lunghezza} m<br>
    Difficoltà: ${data.sentieroPedestre.difficolta}
`;


let divPersone=document.getElementById("persone");
divPersone.innerHTML="<b>PERSONE</b> <br>";
data.persone.forEach(element => {
    divPersone.innerHTML+=`
    ${element.nominativo}<br>
    cellulare: ${element.cellulare}<br>
    lingue: ${element.lingue}<br>
    `;
});});

const url="https://69f9a3b3c509a40d3aa2e0a6.mockapi.io/api/v1/Animale";

const lista=document.getElementById("lista");
const cerca=document.getElementById("cerca");
const aggiorna=document.getElementById("aggiorna");

function creaCard(a){

    const card = document.createElement("div");
    card.classList.add("card");
    card.innerHTML = `
        <h3>nome :${a.nome_comune} ${a.nome_specifico}</h3>
        <p>classe: ${a.classe}</p>
        <p>stato pericolo: ${a.stato} </p>

        <button onclick="modifica('${a.id}')">MODIFICA</button>
        <button onclick="elimina('${a.id}')">ELIMINA</button>
    `;
    return card;
}

function mostra(animali){

    const contenuto=document.getElementById("contenuto");
    contenuto.innerHTML="";
    animali.forEach(a=>{
        contenuto.appendChild(creaCard(a));
    });
}

function carica(){

    fetch(url)
    .then(response=>response.json())
    .then(data=>{
        mostra(data);
    });

}


function mostraFormRicerca(){

    const div=document.getElementById("contenuto");

    div.innerHTML=`

        <input type="text" id="txtNome" placeholder="Nome o stato">

        <button id="btnRicerca">CERCA</button>

        <div id="risultato"></div>

    `;

    document.getElementById("btnRicerca").addEventListener("click", cercaAn);

}

function cercaAn(){

    const nome=document.getElementById("txtNome").value;

    fetch(url)
    .then(response=>response.json())
    .then(animali=>{

        const trovato=animali.find(a=>
            a.nome_comune.toUpperCase()==nome.toUpperCase() || a.stato.toUpperCase()==nome.toUpperCase()
        );

        const risultato=document.getElementById("risultato");
        risultato.innerHTML="";
        if(trovato){
            risultato.appendChild(creaCard(trovato));
        }
        else{
            risultato.innerHTML="<p>animale non trovato.</p>";
        }

    });

}

function mostraFormNuovo(){

    const div=document.getElementById("contenuto");

    div.innerHTML=`

        <input type="text" id="nomeComune" placeholder="nomeComune">

        <input type="text" id="nomeSpecifico" placeholder="nomeSpecifico">

        <input type="text" id="classe" placeholder="classe">

        <input type="text" id="stato" placeholder="Stato">

        <button id="btnSalva">SALVA</button>

    `;
    document.getElementById("btnSalva").addEventListener("click", aggiungi);

}

function aggiungi(){

    const nuovo={

        nome_comune:document.getElementById("nomeComune").value,

        nome_specifico:document.getElementById("nomeSpecifico").value,

        classe:document.getElementById("classe").value,

        stato:document.getElementById("stato").value

    };
    fetch(url,{

        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(nuovo)
    })
    .then(response=>response.json())
    .then(data=>{
        alert("Animale aggiunto!");
        carica();
    });

}
function salvaModifica(id){

    const animale = {

        nome_comune: document.getElementById("nomeComune").value,
        nome_specifico: document.getElementById("nomeSpecifico").value,
        classe: document.getElementById("classe").value,
        stato: document.getElementById("stato").value

    };

    fetch(url + "/" + id, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(animale)

    })
    .then(response => response.json())
    .then(() => {
        alert("Animale modificato");
        carica();
    })
    .catch(error => console.log(error));
}
function modifica(id){

    fetch(url + "/" + id)

    .then(response => response.json())

    .then(d => {

        const div = document.getElementById("contenuto");
        div.innerHTML = `

            <input id="nomeComune" value="${d.nome_comune}">
            <input id="nomeSpecifico" value="${d.nome_specifico}">
            <input id="classe" value="${d.classe}">
            <input id="stato" value="${d.stato}">
            <button id="btnModifica">SALVA MODIFICHE</button>
        `;
        document.getElementById("btnModifica")
            .addEventListener("click", () => salvaModifica(id));
    });

}
function elimina(id){

    fetch(url + "/" + id, {
        method: "DELETE"
    })
    .then(() => {
        alert("Animale eliminato");
        carica();
    })
    .catch(error => console.log(error));

}


lista.addEventListener("click",carica);
cerca.addEventListener("click",mostraFormRicerca);
aggiorna.addEventListener("click",mostraFormNuovo);
</script>
</body>
</html>
