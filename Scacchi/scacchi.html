<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneo di scacchi</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
}

.card{
    border:1px solid black;
    padding:10px;
    margin:10px 0;
    width:250px;
}

input{
    display:block;
    margin:5px 0;
}
</style>

</head>
<body>

<h2>Torneo</h2>

<div id="nome"></div>
<div id="anno"></div>


<hr>

<h1> Gestione Partite</h1>

<button id="lista">LISTA</button>
<button id="cerca">CERCA</button>
<button id="aggiorna">AGGIUNGI</button>

<div id="contenuto"></div>

<script>
fetch("scacchi.json")
.then(r=>r.json())
.then(data=>{

    document.getElementById("nome").innerHTML="<b>"+data.nome+"</b>";
    document.getElementById("anno").innerHTML=+data.anno;
});

const url="https://69f9a3b3c509a40d3aa2e0a6.mockapi.io/api/v1/Partita";

const lista=document.getElementById("lista");
const cerca=document.getElementById("cerca");
const aggiorna=document.getElementById("aggiorna");

function creaCard(a){

    const card = document.createElement("div");
    card.classList.add("card");
    card.innerHTML = `
        <h3>data:${a.data}</h3>
        <p>giocatore bianchi: ${a.bianco.nome} ${a.bianco.cognome} ${a.bianco.punteggio}</p>
        <p>giocatore neri: ${a.nero.nome} ${a.nero.cognome} ${a.nero.punteggio}</p>
        <p>risultato ${a.risultato} </p>

        <button onclick="modifica('${a.id}')">MODIFICA</button>
        <button onclick="elimina('${a.id}')">ELIMINA</button>
    `;
    return card;
}

function mostra(partite){

    const contenuto=document.getElementById("contenuto");
    contenuto.innerHTML="";
    partite.forEach(a=>{
        contenuto.appendChild(creaCard(a));
    });
}

function carica(){

    fetch(url)
    .then(response=>response.json())
    .then(data=>{
        mostra(data);
    });

}


function mostraFormRicerca(){

    const div=document.getElementById("contenuto");

    div.innerHTML=`

        <input type="text" id="txtdata" placeholder="data">

        <button id="btnRicerca">CERCA</button>

        <div id="risultato"></div>

    `;

    document.getElementById("btnRicerca").addEventListener("click", cercaPartita);

}

function cercaPartita(){

    const data=document.getElementById("txtdata").value;

    fetch(url)
    .then(response=>response.json())
    .then(partite=>{

        const trovato=partite.find(a=>
            a.data.toUpperCase()==data.toUpperCase()
        );

        const risultato=document.getElementById("risultato");
        risultato.innerHTML="";
        if(trovato){
            risultato.appendChild(creaCard(trovato));
        }
        else{
            risultato.innerHTML="<p>partita non trovato.</p>";
        }

    });

}

function mostraFormNuovo(){

    const div=document.getElementById("contenuto");

    div.innerHTML=`

        <input type="text" id="data" placeholder="data">
        <p>dati giocatore bianco:<p><br>
        <input type="text" id="bianco_n" placeholder="nome">
        <input type="text" id="bianco_c" placeholder="cognome">
        <input type="number" id="bianco_p" placeholder="punteggio">
        <p>dati giocatore nero:<p><br>
        <input type="text" id="nero_n" placeholder="nome">
        <input type="text" id="nero_c" placeholder="cognome">
        <input type="number" id="nero_p" placeholder="punteggio">
        <input type="text" id="ris" placeholder="risultato">
        <input type="number" id="numMosse" placeholder="numMosse">
        <button id="btnSalva">SALVA</button>

    `;
    document.getElementById("btnSalva").addEventListener("click", aggiungi);

}

function aggiungi(){

    const nuovo = {

        data: document.getElementById("data").value,

        bianco: {
            nome: document.getElementById("bianco_n").value,
            cognome: document.getElementById("bianco_c").value,
            punteggio: document.getElementById("bianco_p").value
        },

        nero: {
            nome: document.getElementById("nero_n").value,
            cognome: document.getElementById("nero_c").value,
            punteggio: document.getElementById("nero_p").value
        },

        risultato: document.getElementById("ris").value,
        numMosse: document.getElementById("numMosse").value
    };

    fetch(url, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(nuovo)
    })
    .then(response => response.json())
    .then(data => {
        alert("partita aggiunta!");
        carica();
    });
}
function salvaModifica(id) {

    const partita = {

        data: document.getElementById("data").value,

        bianco: {
            nome: document.getElementById("bianco_n").value,
            cognome: document.getElementById("bianco_c").value,
            punteggio: document.getElementById("bianco_p").value
        },

        nero: {
            nome: document.getElementById("nero_n").value,
            cognome: document.getElementById("nero_c").value,
            punteggio: document.getElementById("nero_p").value
        },

        risultato: document.getElementById("ris").value,
        numMosse: document.getElementById("numMosse").value
    };

    fetch(url + "/" + id, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(partita)
    })
    .then(response => response.json())
    .then(() => {
        alert("partita modificata");
        carica();
    })
    .catch(error => console.log(error));
}
function modifica(id) {

    fetch(url + "/" + id)
        .then(response => response.json())
        .then(d => {

            const div = document.getElementById("contenuto");

            div.innerHTML = `

                <input id="data" value="${d.data}" placeholder="data">

                <p>Dati giocatore bianco:</p>

                <input id="bianco_n" value="${d.bianco.nome}" placeholder="nome">
                <input id="bianco_c" value="${d.bianco.cognome}" placeholder="cognome">
                <input id="bianco_p" value="${d.bianco.punteggio}" placeholder="punteggio">

                <p>Dati giocatore nero:</p>

                <input id="nero_n" value="${d.nero.nome}" placeholder="nome">
                <input id="nero_c" value="${d.nero.cognome}" placeholder="cognome">
                <input id="nero_p" value="${d.nero.punteggio}" placeholder="punteggio">

                <input id="ris" value="${d.risultato}" placeholder="risultato">
                <input id="numMosse" value="${d.numMosse}" placeholder="numMosse">

                <button id="btnModifica">SALVA MODIFICHE</button>
            `;

            document.getElementById("btnModifica")
                .addEventListener("click", () => salvaModifica(id));
        })
        .catch(error => console.log(error));
}
function elimina(id){

    fetch(url + "/" + id, {
        method: "DELETE"
    })
    .then(() => {
        alert("partita eliminata");
        carica();
    })
    .catch(error => console.log(error));

}


lista.addEventListener("click",carica);
cerca.addEventListener("click",mostraFormRicerca);
aggiorna.addEventListener("click",mostraFormNuovo);
</script>
</body>
</html>
